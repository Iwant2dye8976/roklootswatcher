[package]
name = "rok_watcher"
version = "2.14.2"
edition = "2021"
description = "Rise of Kingdoms - Loots Watcher & Analyzer for Windows"
authors = ["Antigravity"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
open = "5.3"
indexmap = { version = "2.6", features = ["serde"] }
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
rayon = "1.10"
ureq = { version = "2.10", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.2", features = ["tray-icon"] }

[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
