[package]
name = "rok_watcher"
version = "2.0.0"
edition = "2021"
description = "Rise of Kingdoms - Motte, Fort & Barbarian Loot Watcher & Analyzer for Windows"
authors = ["Antigravity"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
open = "5.3"
indexmap = { version = "2.6", features = ["serde"] }
rfd = "0.15"
tray-icon = "0.19"
muda = "0.15"
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }
rayon = "1.10"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
